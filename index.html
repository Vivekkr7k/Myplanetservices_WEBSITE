<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f5ef" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1f1e1c" />
    <title>My Planet Services — SaaS, Web & AI Development Studio</title>
    <meta name="description" content="My Planet Services builds websites, mobile apps, AI automation, SEO/AEO/GEO programs, digital marketing and full SaaS products for scaling teams." />
    
    <!-- Open Graph / Social Media -->
    <meta property="og:title" content="My Planet Services — SaaS, Web & AI Development Studio" />
    <meta property="og:description" content="My Planet Services builds websites, mobile apps, AI automation, SEO/AEO/GEO programs, digital marketing and full SaaS products for scaling teams." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="My Planet Services — SaaS, Web & AI Development Studio" />
    <meta name="twitter:description" content="My Planet Services builds websites, mobile apps, AI automation, SEO/AEO/GEO programs, digital marketing and full SaaS products for scaling teams." />

    <!-- Google Fonts: Geist (Modern Neo-Grotesque), Geist Mono, Inter Tight, Plus Jakarta Sans, Playfair Display -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&family=Inter+Tight:ital,wght@0,100..900;1,100..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-background text-foreground antialiased selection:bg-butter selection:text-butter-foreground">
    <!-- Resolve the theme BEFORE first paint so the page never flashes the wrong
         ground colour. Kept inline and blocking on purpose. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('mps:theme');
          var dark =
            stored === 'dark' ||
            ((!stored || stored === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
